[project]
name = "rsi-rl-dev"
version = "0.1.0"
description = "Self-improving RL environment factory: X complaints + papers -> combined hard tasks -> Harbor-calibrated to ~25% frontier pass rate"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
rsi = "rsi.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rsi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
